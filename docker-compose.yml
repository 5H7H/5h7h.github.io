services:
  app:
    build:
      context: .
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm run posts && pnpm exec vite --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  node_modules:
