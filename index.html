<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/post_style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pangu/4.0.7/pangu.min.js"></script>
    <title>5H7H's Blog</title>
    <style>
        .blog_list_container {
            background-color: white;
            width: 60%;
            margin: 2% 2%;
            padding: 50px;
            padding-bottom: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        /* 分割线 */
        .post-summary {    
            border-bottom: 1px solid #d1cece;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .post-summary a {
            text-decoration: none;
            color: #0066cc; 
            font-size: x-large;
            font-weight: 550;
        }
        .post-summary a:hover {
            color: #074fb3; 
        }
        .date {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 !-->
    <nav class="navbar">
        <div class="nav-logo">
            <a href="/index.html">5H7H's Blog</a>
        </div>
        <div class="nav-about">
            <a href="/about.html">about</a>
        </div>
    </nav>

    <div class="blog_list_container" id="blog-list">
        <!-- 博客列表将由 JavaScript 动态生成并插入到这里 -->
    </div>
</body>
<script src="./JS/index_script.js"></script>
</html>
