<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你好，世界</title>
    <style>
        body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", "Meiryo", sans-serif;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .navi_bar {
            background-color: #eeeeee;
            margin: 0%;
            padding: 1rem;
            padding-left: 3%;
            text-align: left;
        }
        .blog_list_container {
            background-color: white;
            width: 60%;
            margin: 2% 2%;
            padding: 50px;
            padding-bottom: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: left;
        }

        .post-summary {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .post-summary a {
            text-decoration: none; /* 去掉链接的下划线 */
            color: #0066cc; /* 设置标题为蓝色 */
            font-size: 20px;
            font-weight: bold;
        }
        .post-summary a:hover {
            color: #ff6600; /* 鼠标放上去变色，增加趣味性 */
        }
        .date {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
<h1 class = "navi_bar">5H7H's Blog</h1>
    <div class="blog_list_container">
        <div class="post-summary">
            <a href="./first_post.html">我的第一篇博客：一切的开始</a><br>
            <span class="date">2026年5月11日</span>
            <p>今天我决定把网站改成博客。不用框架，不搞复杂架构，就用最原始的 HTML 来搭积木...</p>
        </div>
    </div>
</body>
</html>
